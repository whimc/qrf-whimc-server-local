  custom3:
    name: Feeling the Pressure
    ask-message: '...'
    finish-message: |
      §e[Harlem]§f: If you haven't talked to Misavo in the facility that's built into the crater wall, I think they needed help calibrating some temperature sensors if you wanna lend 'em a hand.
    npc-giver-id: 21
    stages:
      ordered:
        '1':
          start-message: |
            &e[Harlem]&f: You're the latest arrival, huh? Nice to meet ya. Say, if you could help me with calibrating these sensors it would be much appreciated. Just head into the building under us and tell the computer what the pressure is inside.
          complete-message: |
            &e[Harlem]&f: Thanks for helping me out - don't want peoples' eyes popping like water balloons when they pull off their helmet, right?
          objective-override:
          - |
            &7Use /pressure to record the pressure inside the new construction, and input it into the data entry computer next to Harlem.
    planner:
      override: false
    options:
      allow-commands: true
      allow-quitting: true
      ignore-silk-touch: true
      use-dungeonsxl-plugin: false
      use-parties-plugin: true
      share-progress-level: 1
      same-quest-only: true
      share-distance: 0.0
      handle-offline-players: false
  custom4:
    name: What's Cooler Than Being Cool?
    ask-message: '...'
    finish-message: |
      &e[Misavo]&f: I appreciate your assistance. If you have not spoken with Olivia in the materials lab yet, I recommend you do so. I believe she could use an extra hand.
    npc-giver-id: 16
    stages:
      ordered:
        '1':
          objective-override: |
            &7Use /temperature to gauge the temperature inside the ice storage facility, and then input it into the computer near Misavo.
          start-message: |
            &e[Misavo]&f: Greetings, initiate. If you would be so kind as to assist me in calibrating the temperature sensors for our ice storage, it would be appreciated. Just go into the area behind me and tell the computer the current temperature. You seem capable enough.
          complete-message: |
            &e[Misavo]&f: It is comforting to know that we will not be dying of thirst any time soon. Your assistance is greatly appreciated!
    options:
      allow-commands: true
      allow-quitting: true
      use-dungeonsxl-plugin: false
      use-parties-plugin: true
      share-progress-level: 1
      require-same-quest: true
  custom5:
    name: Not-So-Solar-Wind
    ask-message: '...'
    finish-message: |
      &e[Herbert]&f: Hey, by the way newbie, I heard you're making yourself useful and helpin' out around here. From one maintenance person to another, thanks. This place never stops needing an extra pair of hands. And right now, you're making my life less stressful.
    npc-giver-id: 20
    stages:
      ordered:
        '1':
          objective-override: |
            &7Measure the wind inside the biodome using /wind, then input the data into the computer near Huxley.
          start-message: |
            &e[Huxley]&f: I can't tell whether it's just me or if the air circulators are jammed, but could you check real quick? If the circulators are jammed, it could cause a lot of problems for the plants. Enter your findings into this computer so we can document it.
          complete-message: |
            &e[Huxley]&f: Oh, well thanks for checking for me. If you could talk to Herbert in the living quarters and make them aware of the issue, it would be greatly appreciated!
        '2':
          objective-override: |
            &7Find Herbert in the mess hall.
          locations-to-reach:
          - LunarCrater 25.0 17.0 -65.0
          reach-location-radii:
          - 3
          reach-location-names:
          - HerbertLunch
          start-message: |
            &e[Huxley]&f: I think ol' Herbert is on his lunch break right now, so you'll probably find him in the mess hall portion of the living quarters.
          complete-message: |
            &e[Herbert]&f: Sheesh, yet another thing to go on my list. Thanks for lettin' me know. The faster I know about it, the faster I can fix it.
    options:
      allow-commands: true
      allow-quitting: true
      use-dungeonsxl-plugin: false
      use-parties-plugin: true
      share-progress-level: 1
      require-same-quest: true
  custom6:
    name: A Breath of Fresh Air
    ask-message: '...'
    finish-message: |
      &e[Olivia]&f: This was kind of a two person job if you couldn't tell... so thanks for stopping by; Lynn can't be punctual to save her life. I'm sure some others around here would appreciate your help, if you haven't already asked around.
    npc-giver-id: 12
    stages:
      ordered:
        '1':
          objective-override: |
            &7Record the oxygen levels outside the airlock using /oxygen, then input the data into the computer near Olivia.
          start-message: |
            &e[Olivia]&f: Oh, hey. You're the new initiate, right? Cool. Uh, if you could lend me a hand here that would be great. This airlock is leaking and I'm trying to fix it but I don't know how much it's leaking. Could you walk back outside and tell this data entry computer how much oxygen is leaking?
          complete-message: |
            &e[Olivia]&f: Okay. It's not leaking much so as long as I can get a few things from Herbert before the day's done, I should be able to fix it.
    options:
      allow-commands: true
      allow-quitting: true
      use-dungeonsxl-plugin: false
