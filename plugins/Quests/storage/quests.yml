# For non-English characters, this file MUST stay encoded in UTF-8
quests:
  custom1:
    name: Welcome to Lunar Base LeGuin!
    ask-message: '[You have a quest!]'
    finish-message: '[Welcome to LeGuin, initiate.]'
    stages:
      ordered:
        '1':
          npc-ids-to-talk-to:
          - 14
          start-message: '&e[Roger]&f: Go talk to Heinlein to get suited up!'
          complete-message: |
            &e[Heinlein]&f: You must be the new recruit we heard about. Welcome to LeGuin! Before you get to the rest of the base, you should get an EV suit.
          objective-override:
          - '&a(1/5)&7Talk to &bFacility Administrator Heinlein&7. (Right click to
            talk to people or accept assignments from them)'
          - '| &7&nNote:&7 When a quest is completed, it will disappear from your
            &5Quest Journal&7. When you have completed the quests listed above, record
            your progress in the &eCentral Dome&7 with &bAbe K.&7 to go to the exoplanet
            exploration space station!'
        '2':
          locations-to-reach:
          - LunarCrater -8.0 71.0 168.0
          reach-location-radii:
          - 1
          reach-location-names:
          - SuitUp
          complete-message: '&e[Beginning diagnostic... helmet is functioning properly...]'
          objective-override:
          - '&a(2/5)&7Get a new helmet and then talk to Wells at the desk.'
        '3':
          locations-to-reach:
          - LunarCrater -19.0 70.0 164.0
          reach-location-radii:
          - 2
          reach-location-names:
          - Outside
          complete-message: '&e[Pressure and temperature difference detected. Compensating.]'
          objective-override:
          - '&a(3/5) &7Talk to &bWells&7 at the desk and then make your way outside
            and jump around!'
        '4':
          locations-to-reach:
          - LunarCrater 13.0 21.0 10.0
          reach-location-radii:
          - 2
          reach-location-names:
          - Central Dome Entrance
          objective-override:
          - '&a(4/5) &7Walk to the &eCentral Dome&7 (main entrance marked with yellow)
            to meet with &bFacility Overseer, E.A. Blair&7.'
        '5':
          locations-to-reach:
          - LunarCrater 9.0 17.0 -5.0
          reach-location-radii:
          - 4
          reach-location-names:
          - E.A. Blair (yellow EV suit)
          objective-override:
          - '&a(5/5) &7Meet with &bFacility Overseer, E.A. Blair&7.'
    planner:
      override: false
    options:
      allow-commands: true
      allow-quitting: true
      ignore-silk-touch: true
      use-parties-plugin: false
      share-progress-level: 1
      same-quest-only: true
      share-distance: 0.0
      handle-offline-players: false
