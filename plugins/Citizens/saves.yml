        text:
        - '&7(1/3)&f Yo, what''s up? Oh, you''re the new kid? Nice to meet ya. I''m
          Armina, the Nursery Manager. A lot of what I do here is make sure that we
          have a steady supply of biomass/crops when needed, plus I curate the seed
          vault across the hall.'
        - '&7(2/3)&f The plants here are an important part of our ecosystem. Not only
          do they help provide food but they also help to recycle the air. We need
          about &aFOUR &ftrees for every person on the base.'
        - '&7(3/3)&f Plus, if something happens to our crops suddenly, it''s on me
          to get the next generation ready to handle whatever killed the past generation
          if I can, and I have to deal with or amend all the biosecurity measures
          if necessary.'
