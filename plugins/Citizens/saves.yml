        talkitem: '*'
        range: 3.0
        text:
        - NASA runs computer simulations of launches as well as thousands of other
          tests before we ever try the real thing. We look for patterns in data to
          help us understand what's going on.
        - We find these patterns by writing computer programs and using AI. No, not
          like ChatGPT but another kind of "machine learning" that uses big datasets
          to find the best answer.
        - Computer science is actually a lot more about math an algorithms. If you
          like using computers for applications you might be interested in Informatics.
