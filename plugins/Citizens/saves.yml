      type: PLAYER
      text:
        talkitem: '*'
        text:
        - '&7(1/3)&f Oh, hi! I''m Anita, the hydrologist here. Pierre and I are working
          together to test these bodies of water and investigate what is living in
          and near them, in order to see if we can gain any insights into the development
          of life down here.'
        - '&7(2/3)&f ...It''s also really important that we know whether or not we
          can drink and use this water for agricultural purposes, for obvious reasons.'
        - '&7(3/3)&f I''ve been testing the effects of the water on some of these
          foreign plants next to me, to see how it might affect plants from normal
          Earth. Right now it seems to be mostly fine, which is promising!'
