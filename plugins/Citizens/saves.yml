          at least. When we get more people I''ll get some assistants here and there.'
        - '&7(2/4)&f When we can''t really live easily on the surface, subsurface
          living is the clear solution, however getting supplies down into these caves
          and other formations is a pain.'
        - '&7(3/4)&f Before we can even think about establishing a permanent presence,
          we have to do things like run cable and smooth out the land so that we can
          transport large amounts of supplies and machinery without damaging or losing
          them.'
