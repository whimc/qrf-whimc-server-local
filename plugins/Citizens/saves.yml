      type: PLAYER
      text:
        talkitem: '*'
        text:
        - '&7(1/3)&f Hey, what''s up? I''m Pierre, the Xenobiologist on this expedition.
          The conditions are so different here from normal Earth that we might discover
          entirely different evolutionary paths than what we are familiar with. Exciting!'
        - '&7(2/3)&f Since this side of the planet has such an extreme climate, it
          prevents most life from leaving these small pockets of water and moderate
          temperatures. This means that each one of these pockets could have entirely
          different forms of life, found nowhere else!'
        - '&7(3/3)&f Sorry, you can probably tell I''m really passionate about this.
          Hey, thanks for stopping by, and if you haven''t talked to Anita, you should!
          Without her help I wouldn''t be able to do most of my research, and I''m
          really grateful for her help!'
