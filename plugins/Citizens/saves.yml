      text:
        delay: 600
        talkitem: '*'
        range: 2.0
        text:
        - '&7(1/3)&f Heya! You want to know what I''m doing down here? That''s not
          something I hear too often! Down here are the nutrient distribution and
          resource recapturing systems to ensure as little resource loss as possible
          while we are growing crops and producing oxygen.'
        - '&7(2/3)&f It''s super important to retain as many resources as possible
          up here on the Moon, because, well, we won''t be getting anything other
          than water from the Moon, and so we can''t afford to waste anything we get
          sent from Earth! Waste not, want not!'
        - '&7(3/3)&f I also test root samples taken from these exposed root balls
          to see how our crops are responding to the symbiotic fungi we''ve integrated
          into the soil, as well as how well the crops are adapting to lowered gravity.'
