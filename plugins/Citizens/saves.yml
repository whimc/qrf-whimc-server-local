      type: PLAYER
      text:
        talkitem: '*'
        text:
        - '&7(1/4)&f Hey, I see you''re exploring around here too. I''m planning to
          take a hike up to the mountains soon, just for a bit of fun. I''m curious
          as to how tall they are, so I''ll probably use &d/altitude&f to see.'
        - '&7(2/4)&f A lot of these variables affect one another, so I''ll probably
          use &d/temperature&f and &d/airflow&f to see how they change with altitude.'
        - '&7(3/4)&f Actually, now that I think about it, I should probably use &d/oxygen&f
          as I go up just to make sure the air isn''t getting too thin. Hmm, maybe
          I should''ve planned this trip a bit better.'
        - '&7(4/4)&f Anyways, it was nice talking to you! &dRemember to collect a
