    name: Kwali T.
    uuid: a6aaa2f6-837e-47e9-9a0e-3bdbdb17f880
    traits:
      text:
        talkitem: '*'
        text:
        - '&7(1/3)&f Oh, hey! Didn''t notice you come in. I''m the main electrical
          engineer here, and I manage the large wind turbine you can see up on the
          hill. It''s our main source of power production, so it''s pretty important.'
        - '&7(2/3)&f As you might have noticed, it''s pretty windy here, and we are
          trying to take advantage of that as much as possible. This wind turbine
          had to be constructed out of especially durable materials to withstand the
          higher winds here.'
        - '&7(3/3)&f But ultimately it''s worth it, because wind power is, in this
          case, more effective than solar power, which is generally our go-to. I''m
          a bit bored here, so humor me - &dcan you figure out why wind is better
          than solar here, besides it being more windy?'
