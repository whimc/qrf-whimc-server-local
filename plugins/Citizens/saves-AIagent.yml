            we might discover entirely different evolutionary paths than what we are
            familiar with. Exciting!'
          '1': '&7(2/3)&f Since this side of the planet has such an extreme climate,
            it prevents most life from leaving these small pockets of water and moderate
            temperatures. This means that each one of these pockets could have entirely
            different forms of life, found nowhere else!'
          '2': '&7(3/3)&f Sorry, you can probably tell I''m really passionate about
